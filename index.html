<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Hot Jobs Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #F6F5F1; --surface: #FFFFFF; --fg: #1B1B1F; --muted: #6E6D75; --line: #E1DFD8; --soft: #EFEDE7;
  --accent: #E25A0C; --accent-fg: #FFFFFF;
  --late: #B6382C; --today: #E25A0C; --tomorrow: #B98300; --ok: #3A7A4B; --chip: #ECEAE3;
  --font-display: "Barlow Condensed", "Arial Narrow", "DIN Condensed", sans-serif;
  --font-body: "Barlow", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141416; --surface: #1E1E22; --fg: #F1F0EC; --muted: #A09FA8; --line: #2F2F36; --soft: #26262C;
  --accent: #FF7A33; --accent-fg: #1B1B1F; --late: #FF6B5C; --today: #FF7A33; --tomorrow: #E6B23A; --ok: #6FC287; --chip: #2B2B31;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #141416; --surface: #1E1E22; --fg: #F1F0EC; --muted: #A09FA8; --line: #2F2F36; --soft: #26262C;
  --accent: #FF7A33; --accent-fg: #1B1B1F; --late: #FF6B5C; --today: #FF7A33; --tomorrow: #E6B23A; --ok: #6FC287; --chip: #2B2B31;
  color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.4; }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 12px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 8px 0 14px; border-bottom: 2px solid var(--fg); }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1; margin: 0; letter-spacing: .01em; text-transform: uppercase; }
h1 span { color: var(--accent); }
.fresh { color: var(--muted); font-size: 13px; }
.fresh.stale { color: var(--tomorrow); }
button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 7px 12px; font-weight: 500; }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
button.quiet { border-color: transparent; background: transparent; color: var(--muted); }
.group { margin-top: 22px; }
.group h2 { font-family: var(--font-display); font-weight: 600; font-size: 22px; letter-spacing: .04em; text-transform: uppercase; margin: 0 0 8px; display: flex; align-items: baseline; gap: 10px; }
.group h2 .n { font-family: var(--font-body); font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0; text-transform: none; }
.group.late h2 { color: var(--late); } .group.today h2 { color: var(--today); } .group.tomorrow h2 { color: var(--tomorrow); }
.job { display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
.due { font-family: var(--font-display); line-height: 1; padding-top: 2px; }
.due .day { font-size: 13px; font-weight: 600; letter-spacing: .06em; color: var(--muted); }
.due .date { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.due .rel { font-family: var(--font-body); font-size: 12px; color: var(--muted); margin-top: 2px; }
.late .due .date { color: var(--late); } .today .due .date { color: var(--today); } .tomorrow .due .date { color: var(--tomorrow); }
.who { min-width: 0; }
.cust { font-weight: 600; font-size: 17px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { font-size: 12px; background: var(--chip); color: var(--fg); border-radius: 999px; padding: 2px 9px; }
.chip.why { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
.chip.big { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.note { margin-top: 6px; font-size: 14px; color: var(--muted); }
.status { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; border-radius: 999px; padding: 5px 10px; border: 1px solid var(--line); background: var(--soft); white-space: nowrap; }
.status.proof { border-color: var(--tomorrow); color: var(--tomorrow); }
.status.approved, .status.production { border-color: var(--ok); color: var(--ok); }
.empty { color: var(--muted); padding: 28px 0; text-align: center; }
.gate { max-width: 360px; margin: 60px auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 22px; display: flex; flex-direction: column; gap: 10px; }
.gate h1 { font-size: 32px; }
.gate p { margin: 0; color: var(--muted); font-size: 14px; }
.gate input { font: inherit; font-size: 22px; letter-spacing: .2em; text-align: center; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); }
.gate .err { color: var(--late); font-size: 14px; min-height: 1.2em; }
.foot { margin-top: 28px; color: var(--muted); font-size: 13px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.foot a { color: var(--accent); }
@media (max-width: 520px) {
  h1 { font-size: 32px; }
  .job { grid-template-columns: 70px minmax(0, 1fr); }
  .act { grid-column: 1 / -1; display: flex; justify-content: flex-end; }
  .due .date { font-size: 22px; }
}
</style>
</head>
<body>
<div class="wrap">
  <form class="gate" id="gate" autocomplete="off">
    <h1>Hot <span>Jobs</span></h1>
    <p>Staff only. Enter the code to see the list.</p>
    <input id="code" type="password" inputmode="numeric" placeholder="code" aria-label="code" required>
    <div class="err" id="err"></div>
    <button class="primary" type="submit">Open</button>
  </form>

  <div id="app" hidden>
    <header>
      <div><h1>Hot <span>Jobs</span></h1><div class="fresh" id="fresh"></div></div>
      <div><button id="lock" class="quiet">Lock</button></div>
    </header>
    <div id="list"></div>
    <div class="foot">
      <span>Finished one, ordered blanks, or want a note on it? Tell Claude and it updates on the next refresh.</span>
    </div>
  </div>
</div>

<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const ORDER = ["shell", "proof", "approved", "production", "done"];
  const LABEL = { shell: "Shell", proof: "Proof out", approved: "Approved", production: "In production", done: "Done" };
  const GROUPS = [["late", "Past due"], ["today", "Today"], ["tomorrow", "Tomorrow"], ["week", "This week"], ["next", "Next week"], ["later", "Big ones coming"]];
  const DOW = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const dayDiff = (iso) => { if (!iso) return null; const [y, m, d] = iso.split("-").map(Number); const a = new Date(y, m - 1, d), b = new Date(); b.setHours(0, 0, 0, 0); return Math.round((a - b) / 86400000); };
  const bucket = (j) => { const n = dayDiff(j.due); if (n === null) return "later"; if (n < 0) return "late"; if (n === 0) return "today"; if (n === 1) return "tomorrow"; if (n <= 7) return "week"; if (n <= 14) return "next"; return "later"; };
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

  async function decrypt(enc, code) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(enc.salt), iterations: enc.iter || 120000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(enc.iv) }, key, b64(enc.data));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  function effStatus(j, mark) {
    if (mark && mark.done) return "done";
    let s = ORDER.includes(j.status_auto) ? j.status_auto : "shell";
    if (mark && ORDER.includes(mark.status_manual) && ORDER.indexOf(mark.status_manual) > ORDER.indexOf(s)) s = mark.status_manual;
    return s;
  }

  function render(feed) {
    const list = $("#list"); list.innerHTML = "";
    const marks = feed.marks || {};
    const jobs = Object.values(feed.jobs || {}).filter((j) => !(marks[j.job_id] && marks[j.job_id].done));
    if (!jobs.length) { list.innerHTML = '<div class="empty">Nothing hot right now.</div>'; return; }
    for (const [key, title] of GROUPS) {
      const rows = jobs.filter((j) => bucket(j) === key).sort((a, b) => (a.due || "9999") < (b.due || "9999") ? -1 : (a.due || "9999") > (b.due || "9999") ? 1 : (b.pieces || 0) - (a.pieces || 0));
      if (!rows.length) continue;
      const g = document.createElement("section"); g.className = "group " + key;
      g.innerHTML = "<h2>" + title + ' <span class="n">' + rows.length + "</span></h2>";
      for (const j of rows) {
        const mark = marks[j.job_id] || {}, st = effStatus(j, mark);
        let due = '<div class="day">NO DATE</div><div class="date">—</div>';
        if (j.due) { const [y, m, d] = j.due.split("-").map(Number); const n = dayDiff(j.due);
          const rel = n === 0 ? "today" : n === 1 ? "tomorrow" : n < 0 ? (-n) + (n === -1 ? " day late" : " days late") : "in " + n + " days";
          due = '<div class="day">' + DOW[new Date(y, m - 1, d).getDay()] + '</div><div class="date">' + m + "/" + d + '</div><div class="rel">' + rel + "</div>"; }
        else if (j.due_text) due = '<div class="day">NEED BY</div><div class="date" style="font-size:15px">' + esc(j.due_text) + "</div>";
        const chips = [];
        if (j.pieces) chips.push('<span class="chip' + ((j.reasons || []).some((r) => /pieces/.test(r)) ? " big" : "") + '">' + j.pieces + " pc</span>");
        if (j.decoration) chips.push('<span class="chip">' + esc(j.decoration) + "</span>");
        if (j.proof_version && j.proof_version !== "V1") chips.push('<span class="chip">' + esc(j.proof_version) + "</span>");
        for (const r of (j.reasons || [])) if (!/^due |pieces$|past due/.test(r)) chips.push('<span class="chip why">' + esc(r) + "</span>");
        if (st === "proof" && j.proof_sent_at) chips.push('<span class="chip why">proof out ' + esc(j.proof_sent_at.slice(5, 10).replace("-", "/")) + ", no answer</span>");
        const el = document.createElement("article"); el.className = "job " + key;
        el.innerHTML = '<div class="due">' + due + '</div><div class="who"><div class="cust">' + esc(j.customer) + '</div><div>' + esc(j.job) + '</div><div class="chips">' + chips.join("") + "</div>" +
          (mark.note ? '<div class="note">' + esc(mark.note) + "</div>" : "") + '</div><div class="act"><span class="status ' + st + '">' + LABEL[st] + "</span></div>";
        g.appendChild(el);
      }
      list.appendChild(g);
    }
    const f = $("#fresh");
    if (feed.refreshed_at) { const d = new Date(feed.refreshed_at); const age = (Date.now() - d) / 60000;
      f.textContent = "Updated " + d.toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" }) + " · hot = due within " + (feed.rules ? feed.rules.window_days : 7) + " days or " + (feed.rules ? feed.rules.big_pieces : 48) + "+ pieces";
      f.classList.toggle("stale", age > 150); }
  }

  async function open(code) {
    const r = await fetch("feed.enc.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("no feed");
    const enc = await r.json();
    const feed = await decrypt(enc, code);
    try { localStorage.setItem("hotjobs.code", code); } catch (e) {}
    $("#gate").hidden = true; $("#app").hidden = false;
    render(feed);
  }

  $("#gate").addEventListener("submit", async (e) => {
    e.preventDefault(); $("#err").textContent = "";
    try { await open($("#code").value.trim()); }
    catch (err) { $("#err").textContent = err.message === "no feed" ? "The list isn't published right now." : "That code didn't work."; }
  });
  $("#lock").addEventListener("click", () => { try { localStorage.removeItem("hotjobs.code"); } catch (e) {} location.reload(); });

  let saved = null; try { saved = localStorage.getItem("hotjobs.code"); } catch (e) {}
  if (saved) open(saved).catch(() => { try { localStorage.removeItem("hotjobs.code"); } catch (e) {} });
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !$("#app").hidden && saved) open(saved).catch(() => {}); });
})();
</script>
</body>
</html>
